name: Deploy portfolio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore original artwork cache
        uses: actions/cache@v4
        with:
          path: _media
          key: portfolio-artwork-${{ hashFiles('build.py') }}
          restore-keys: portfolio-artwork-
      - name: Install optimizer and browser test dependencies
        run: python -m pip install Pillow playwright
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Build site and import original artwork
        run: python build.py
      - name: Validate publishing directory
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('_site')
          for name in ('index.html', 'styles.css', 'slideshow.css', 'app.js'):
              path = root / name
              assert path.is_file() and path.stat().st_size > 100, f'Missing publishing file: {path}'
          manifest = json.loads((root / 'media/manifest.json').read_text())
          assert len(manifest) == 20 and all(item['ok'] for item in manifest)
          assert all((root / item['path']).is_file() for item in manifest)
          (root / '.nojekyll').touch()
          print('Publishing root contains the slideshow, styles, JavaScript, and all 20 images.')
          PY
      - name: Browser layout, slideshow, and gallery checks
        run: python qa.py
      - name: Save browser verification and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-qa
          path: _qa
          retention-days: 7
      - name: Save site for visual QA
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-site
          path: _site
          retention-days: 7
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify exact public URLs and all artwork
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import hashlib, json, os, time, urllib.request
          from pathlib import Path
          base = os.environ['SITE_URL'].rstrip('/') + '/'
          version = os.environ['GITHUB_SHA']
          report = {'url': base, 'commit': version, 'success': False, 'checks': []}
          Path('_live').mkdir(exist_ok=True)
          def verify(route, filename):
              expected = (Path('_site') / filename).read_bytes()
              check = {'url': base + route, 'file': filename, 'attempts': []}
              report['checks'].append(check)
              for attempt in range(12):
                  try:
                      request = urllib.request.Request(base + route, headers={'User-Agent': 'Mozilla/5.0 Portfolio-Public-Verification', 'Cache-Control': 'no-cache'})
                      with urllib.request.urlopen(request, timeout=20) as response:
                          actual = response.read()
                          status = response.status
                          headers = dict(response.headers)
                          final_url = response.url
                      check['attempts'].append({'status': status, 'final_url': final_url, 'headers': headers, 'bytes': len(actual), 'matches_build': actual == expected})
                      assert status == 200 and actual == expected, 'Public response does not match the deployed site'
                      check.update({'status': status, 'matches_build': True, 'sha256': hashlib.sha256(actual).hexdigest()})
                      print('PUBLIC VERIFIED:', base + route, status, 'exact build match', flush=True)
                      return
                  except Exception as error:
                      check['attempts'].append({'error': str(error)})
                      if attempt == 11:
                          raise
                      time.sleep(8)
          try:
              for route, filename in [('', 'index.html'), ('index.html', 'index.html'), ('styles.css', 'styles.css'), ('slideshow.css', 'slideshow.css'), ('app.js', 'app.js'), ('?v=' + version, 'index.html')]:
                  verify(route, filename)
              manifest = json.loads(Path('_site/media/manifest.json').read_text())
              for item in manifest:
                  verify(item['path'], item['path'])
              report['success'] = True
          finally:
              Path('_live/http-verification.json').write_text(json.dumps(report, indent=2))
          PY
      - name: Open the live slideshow in a fresh browser
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          base = os.environ['SITE_URL'].rstrip('/') + '/'
          report = {'url': base, 'success': False, 'errors': [], 'checks': []}
          Path('_live').mkdir(exist_ok=True)
          try:
              with sync_playwright() as p:
                  browser = p.chromium.launch(headless=True)
                  page = browser.new_page(viewport={'width': 1440, 'height': 1000})
                  page.on('pageerror', lambda error: report['errors'].append(str(error)))
                  response = page.goto(base, wait_until='networkidle', timeout=60000)
                  report.update(status=response.status, final_url=page.url, title=page.title())
                  assert response.status == 200, 'Canonical live page returned an HTTP error'
                  assert page.locator('#hero-title').count() == 1, 'Portfolio heading is missing'
                  report['heading'] = page.locator('#hero-title').inner_text()
                  report['state'] = page.evaluate('portfolioState()')
                  assert report['state']['renderer'] == 'slideshow', 'Slideshow is not live'
                  assert page.locator('#hero-canvas').count() == 0, 'Old sculpture remains'
                  first = report['state']['slideshow']['rotations']
                  page.wait_for_function('(n)=>portfolioState().slideshow.rotations > n', arg=first, timeout=12000)
                  report['checks'].append('Live slideshow automatically advances')
                  for i, key in enumerate(['fresh','independent','acuity']):
                      page.click(f'[data-show-slide="{i}"]')
                      page.wait_for_timeout(1000)
                      assert page.evaluate('portfolioState().slideshow.project') == key
                      page.locator('.hero-slide.is-current img').evaluate('(e)=>e.decode()')
                      page.screenshot(path=f'_live/public-{key}.png')
                  page.click('[data-show-slide="0"]')
                  page.wait_for_timeout(1000)
                  page.screenshot(path='_live/public-desktop.png')
                  page.set_viewport_size({'width': 390, 'height': 844})
                  page.locator('#hero-showcase').scroll_into_view_if_needed()
                  page.screenshot(path='_live/public-mobile.png')
                  assert not report['errors'], 'Live page has JavaScript exceptions'
                  browser.close()
              report['success'] = True
          finally:
              Path('_live/browser-verification.json').write_text(json.dumps(report, indent=2))
              print(json.dumps(report, indent=2))
          PY
      - name: Save live verification reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-verification
          path: _live
          if-no-files-found: warn
          retention-days: 7
