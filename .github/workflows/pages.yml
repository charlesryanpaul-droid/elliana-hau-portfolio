name: Deploy portfolio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore original artwork cache
        uses: actions/cache@v4
        with:
          path: _media
          key: portfolio-artwork-${{ hashFiles('build.py') }}
      - name: Install image optimizer
        run: python -m pip install Pillow
      - name: Build site and import original artwork
        run: python build.py
      - name: Save site for visual QA
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-site
          path: _site
          retention-days: 7
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
